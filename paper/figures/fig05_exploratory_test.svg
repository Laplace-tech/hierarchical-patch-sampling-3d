<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Exploratory held-out test: B0 and P Dice at 10K and 30K updates</title>
<desc id="desc">49 held-out cases, selected seeds 55254 and 55255. At 10K, B0 Dice 0.7053 and P Dice 0.7677, difference plus 6.2430 percentage points with 95% interval 4.4458 to 8.2161. At 30K, B0 Dice 0.9052 and P Dice 0.9067, difference plus 0.1541 points with interval minus 0.3884 to 0.6086. Exploratory comparison after a failed validation primary.</desc>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#14273d}
  .title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#53647a}
  .panel{fill:#fff;stroke:#d7e0e9;stroke-width:1.2}.head{font-size:19px;font-weight:700}
  .note{font-size:13px;fill:#5b6a7f}.tick{font-size:13px;fill:#53647a}
  .grid{stroke:#e6ebf1;stroke-width:1}.axis{stroke:#8897a9;stroke-width:1.2}
  .zero{stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 4}
  .b0line{fill:none;stroke:#2563eb;stroke-width:3}.pline{fill:none;stroke:#d97706;stroke-width:3}
  .b0{fill:#2563eb;stroke:white;stroke-width:2}.p{fill:#d97706;stroke:white;stroke-width:2}
  .ci{stroke:#d97706;stroke-width:2.5}.value{font-size:15px;font-weight:700}
  .foot{font-size:13px;fill:#44556a}
</style>
